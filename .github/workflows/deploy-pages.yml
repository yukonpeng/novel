name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: rm -f package-lock.json && npm install

      - run: node node_modules/vite/bin/vite.js build --config vite.config.standalone.ts

      - name: Add iOS PWA meta tags
        run: |
          node -e "
          const fs = require('fs');
          const p = '.output/standalone/index.html';
          let h = fs.readFileSync(p, 'utf-8');
          h = h.replace('<title>Novel Reader</title>', '<title>Novel Reader</title>\n    <meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n    <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n    <meta name=\"apple-mobile-web-app-title\" content=\"Novel Reader\">');
          fs.writeFileSync(p, h);
          "

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/standalone

      - uses: actions/deploy-pages@v4
        id: deployment
